[database]
path = "data/market.db"

[collector]
raw_data_dir = "data/raw"
manual_data_dir = "data/manual"
request_timeout_seconds = 30
max_retries = 3
minimum_symbols_hose = 30
minimum_symbols_hnx = 10
minimum_symbols_upcom = 10
holidays = []

[sources]
hose_enabled = true
hnx_enabled = true
upcom_enabled = true
