[package]
name = "oak-desktop"
version = "0.1.0"
description = "OAK Manager desktop shell (Tauri v2 + React + Python sidecar)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
