name: H1 Cloud Scanner

on:
  schedule:
    # Avoid GitHub's top-of-hour congestion. Start at :58, wait inside the
    # runner, then call Vercel on the next H:00 boundary.
    - cron: "58 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: h1-cloud-scanner
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for H:00 boundary
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          now="$(date -u +%s)"
          minute="$(date -u +%M)"
          if (( 10#$minute >= 58 )); then
            target="$(( (now / 3600 + 1) * 3600 ))"
            delay="$(( target - now ))"
            if (( delay > 0 && delay <= 180 )); then
              sleep "$delay"
            fi
          fi

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=oak-h1-cloud-scanner")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json")"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Trigger private scanner route
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 45 \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            https://www.oakgatekeeper.uk/api/h1-scanner/run
