name: Stock Data Crawl

on:
  schedule:
    - cron: "0 2 * * 1-5"  # Mon-Fri 2am UTC (9am VN)
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols (empty = all)"
        required: false
        default: ""
      limit:
        description: "Max symbols to crawl (0=all)"
        required: false
        default: "0"

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl stock data
        run: |
          SYMBOLS_FLAG=""
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            SYMBOLS_FLAG="--symbols ${{ github.event.inputs.symbols }}"
          fi
          python -m stock_data_crawler.crawler \
            --symbols-file data/symbols.json \
            --output dashboard/public/stock-data \
            --workers 4 \
            $SYMBOLS_FLAG \
            --limit ${{ github.event.inputs.limit || '0' }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/stock-data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "data: update stock data [$DATE]"
            git push
          fi
