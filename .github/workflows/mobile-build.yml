name: Mobile Build

on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - "ios-native/**"
      - "dashboard/src/app/api/mobile/**"
      - "dashboard/src/lib/h1-signals.ts"
      - "dashboard/src/lib/h1-signals.test.ts"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "mobile/**"
      - "ios-native/**"
      - "dashboard/src/app/api/mobile/**"
      - "dashboard/src/lib/h1-signals.ts"
      - "dashboard/src/lib/h1-signals.test.ts"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  verify-android:
    name: Verify Android bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Typecheck Android app
        working-directory: mobile
        run: pnpm typecheck

      - name: Bundle Android JavaScript
        working-directory: mobile
        run: pnpm bundle:android

  build-android:
    name: Build Android APK
    needs: verify-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Generate Android native project
        working-directory: mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify release APK contains bundled JS
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          unzip -l "$APK_PATH" | grep -E 'assets/(index.android.bundle|index.android\.bundle\.hbc)$'

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OAK-Gatekeeper-Android-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build native iOS 27 unsigned IPA
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and Swift toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native Xcode project
        working-directory: ios-native
        run: xcodegen generate --spec project.yml

      - name: Verify native-only iOS sources
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'ReactNative|ExpoModules|expo-router|react-native' ios-native/Sources; then
            echo "Native iOS source unexpectedly depends on React Native / Expo" >&2
            exit 1
          fi
          grep -R -n 'TabView' ios-native/Sources/OAKGatekeeper/MainTabView.swift
          grep -R -n 'tabBarMinimizeBehavior' ios-native/Sources/OAKGatekeeper/MainTabView.swift

      - name: Build unsigned native iPhoneOS app
        working-directory: ios-native
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project OAKGatekeeper.xcodeproj \
            -scheme OAKGatekeeper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package unsigned IPA
        working-directory: ios-native
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No unsigned native iPhoneOS app produced" >&2
            exit 1
          fi
          rm -rf ipa-payload
          mkdir -p ipa-payload/Payload
          ditto "$APP_PATH" "ipa-payload/Payload/$(basename "$APP_PATH")"
          find ipa-payload/Payload -type d -name '_CodeSignature' -prune -exec rm -rf {} +
          find ipa-payload/Payload -name 'embedded.mobileprovision' -delete
          (
            cd ipa-payload
            /usr/bin/zip -qry ../OAK-Gatekeeper-native-unsigned.ipa Payload
          )
          test -s OAK-Gatekeeper-native-unsigned.ipa

      - name: Upload native iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: OAK-Gatekeeper-iOS27-native-unsigned
          path: ios-native/OAK-Gatekeeper-native-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
