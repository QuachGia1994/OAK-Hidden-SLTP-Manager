name: Mobile Build - Xcode 26.4 diagnostic

on:
  push:
    branches: [main, master]
    paths:
      - "android-native/**"
      - "ios-native/**"
      - "dashboard/src/app/api/mobile/**"
      - "dashboard/src/lib/h1-signals.ts"
      - "dashboard/src/lib/h1-signals.test.ts"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "android-native/**"
      - "ios-native/**"
      - "dashboard/src/app/api/mobile/**"
      - "dashboard/src/lib/h1-signals.ts"
      - "dashboard/src/lib/h1-signals.test.ts"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "1"

jobs:
  build-android:
    if: false
    name: Build native Android APK/AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android API 36 and build tools
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify native Android configuration
        working-directory: android-native
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'compileSdk = 36' app/build.gradle.kts
          grep -n 'targetSdk = 36' app/build.gradle.kts
          grep -n 'isMinifyEnabled = true' app/build.gradle.kts
          grep -n 'isShrinkResources = true' app/build.gradle.kts
          grep -n 'jniLibs.useLegacyPackaging = false' app/build.gradle.kts
          grep -n 'android.enableR8.fullMode=true' gradle.properties
          grep -n 'onTrimMemory' app/src/main/java/uk/oakgatekeeper/mobile/MainActivity.kt
          grep -n 'TRIM_MEMORY_UI_HIDDEN' app/src/main/java/uk/oakgatekeeper/mobile/MainActivity.kt
          grep -n 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable-nodpi/oak_launcher_foreground.png
          test -s app/src/main/res/drawable-nodpi/oak_launcher_monochrome.png
          grep -n '@color/oak_launcher_mask_bg' app/src/main/res/mipmap-anydpi/ic_launcher.xml
          grep -n '@drawable/oak_launcher_foreground' app/src/main/res/mipmap-anydpi/ic_launcher.xml
          grep -n '@drawable/oak_launcher_monochrome' app/src/main/res/mipmap-anydpi/ic_launcher.xml
          grep -n '<color name="oak_launcher_mask_bg">#07110F</color>' app/src/main/res/values/colors.xml

      - name: Build release APK first
        working-directory: android-native
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK Google Play 2027 memory/page/DEX gates
        working-directory: android-native
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          # 16 KB page-size readiness: this native Compose client intentionally
          # ships no app-owned NDK code; any packaged .so must still pass zipalign.
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          if unzip -Z1 "$APK" | grep -qE '^lib/.+\.so$'; then
            echo "Packaged native libraries:"
            unzip -Z1 "$APK" | grep -E '^lib/.+\.so$'
          else
            echo "No packaged native libraries; 16 KB ELF alignment is vacuously satisfied."
          fi

          # Keep the app below Google's >10 MB app DEX enforcement floor.
          DEX_BYTES=$(zipinfo -l "$APK" | awk '/classes([0-9]+)?\.dex$/ {sum += $4} END {print sum+0}')
          echo "Release DEX bytes: $DEX_BYTES"
          test "$DEX_BYTES" -lt 10485760

          # R8 must actually produce optimization artifacts, not just be configured.
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s app/build/outputs/mapping/release/usage.txt

          # This UI is text/vector/Canvas-first. No persistent image loader/cache is allowed.
          if grep -R -n -E 'Coil|Glide|BitmapFactory|LruCache<.*Bitmap|static.*Bitmap' app/src/main/java; then
            echo "Memory-heavy bitmap cache/loader found" >&2
            exit 1
          fi

      - name: Upload installable APK early
        uses: actions/upload-artifact@v4
        with:
          name: OAK-Gatekeeper-Android-native-APK
          path: android-native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests and build AAB
        working-directory: android-native
        run: ./gradlew :app:test :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Play bundle and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: OAK-Gatekeeper-Android-native-AAB
          path: |
            android-native/app/build/outputs/bundle/release/app-release.aab
            android-native/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Run strict release lint
        id: android_lint
        continue-on-error: true
        working-directory: android-native
        run: ./gradlew :app:lintRelease --no-daemon --stacktrace

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OAK-Gatekeeper-Android-lint
          path: |
            android-native/app/build/reports/lint-results-release.html
            android-native/app/build/reports/lint-results-release.sarif
            android-native/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce strict Android lint
        if: steps.android_lint.outcome != 'success'
        shell: bash
        run: |
          echo "Strict Android lint failed; inspect OAK-Gatekeeper-Android-lint artifact." >&2
          exit 1

  build-ios:
    name: Build native iOS 26.4 diagnostic IPA
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and Swift toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native Xcode project
        working-directory: ios-native
        run: xcodegen generate --spec project.yml

      - name: Verify native iOS AppIcon
        working-directory: ios-native
        shell: bash
        run: |
          set -euo pipefail
          test -s Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test "$(sips -g pixelWidth Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png | awk '/pixelWidth/ {print $2}')" = "1024"
          test "$(sips -g pixelHeight Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png | awk '/pixelHeight/ {print $2}')" = "1024"
          grep -n 'ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon' project.yml

      - name: Verify native-only iOS sources
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'ReactNative|ExpoModules|expo-router|react-native' ios-native/Sources; then
            echo "Native iOS source unexpectedly depends on React Native / Expo" >&2
            exit 1
          fi
          grep -R -n 'TabView' ios-native/Sources/OAKGatekeeper/MainTabView.swift
          grep -R -n 'tabBarMinimizeBehavior' ios-native/Sources/OAKGatekeeper/MainTabView.swift

      - name: Build unsigned native iPhoneOS app
        working-directory: ios-native
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project OAKGatekeeper.xcodeproj \
            -scheme OAKGatekeeper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package raw unsigned and zsign-ready IPAs
        working-directory: ios-native
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No unsigned native iPhoneOS app produced" >&2
            exit 1
          fi

          # Keep a truly unsigned IPA for diagnostics/archive use.
          rm -rf ipa-payload
          mkdir -p ipa-payload/Payload
          ditto "$APP_PATH" "ipa-payload/Payload/$(basename "$APP_PATH")"
          find ipa-payload/Payload -type d -name '_CodeSignature' -prune -exec rm -rf {} +
          find ipa-payload/Payload -name 'embedded.mobileprovision' -delete
          (
            cd ipa-payload
            /usr/bin/zip -qry ../OAK-Gatekeeper-native-raw-unsigned.ipa Payload
          )
          test -s OAK-Gatekeeper-native-raw-unsigned.ipa

          # zsign is a re-signer. Some older/mobile wrappers fail when Xcode emits
          # a Mach-O with no LC_CODE_SIGNATURE at all because they must realloc a
          # signature segment from zero. Seed the bundle with a pinned zsign build
          # itself so a later zsign pass starts from zsign-sized signature space.
          rm -rf zsign-payload
          mkdir -p zsign-payload/Payload
          ditto "$APP_PATH" "zsign-payload/Payload/$(basename "$APP_PATH")"
          ZSIGN_APP="zsign-payload/Payload/$(basename "$APP_PATH")"
          find "$ZSIGN_APP" -type d -name '_CodeSignature' -prune -exec rm -rf {} +
          find "$ZSIGN_APP" -name 'embedded.mobileprovision' -delete

          ZSIGN_VERSION="v1.1.2"
          ZSIGN_SHA256="3f84a08150c2c41ccf80bfeca9ee6bc86ae1ff771323cd9931c4d8cd438ade0d"
          ZSIGN_ARCHIVE="$RUNNER_TEMP/zsign-macos-arm64.tar.gz"
          ZSIGN_DIR="$RUNNER_TEMP/zsign-v1.1.2"
          curl -fsSL "https://github.com/zhlynn/zsign/releases/download/${ZSIGN_VERSION}/zsign-macos-arm64.tar.gz" -o "$ZSIGN_ARCHIVE"
          echo "${ZSIGN_SHA256}  ${ZSIGN_ARCHIVE}" | shasum -a 256 -c -
          mkdir -p "$ZSIGN_DIR"
          tar -xzf "$ZSIGN_ARCHIVE" -C "$ZSIGN_DIR"
          ZSIGN_BIN=$(find "$ZSIGN_DIR" -type f -name zsign -print -quit)
          test -n "$ZSIGN_BIN"
          chmod +x "$ZSIGN_BIN"
          "$ZSIGN_BIN" -a -f "$ZSIGN_APP"

          /usr/bin/codesign --verify --deep --strict "$ZSIGN_APP"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$ZSIGN_APP/Info.plist")
          SIG_SIZE=$(otool -l "$ZSIGN_APP/$EXECUTABLE" | awk '/LC_CODE_SIGNATURE/{found=1; next} found && $1=="datasize" {print $2; exit}')
          test -n "$SIG_SIZE"
          test "$SIG_SIZE" -ge 20000
          test -s "$ZSIGN_APP/_CodeSignature/CodeResources"
          (
            cd zsign-payload
            /usr/bin/zip -qry ../OAK-Gatekeeper-native-zsign-ready.ipa Payload
          )
          test -s OAK-Gatekeeper-native-zsign-ready.ipa

      - name: Upload zsign-ready native iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: OAK-Gatekeeper-iOS26.4-diagnostic-zsign-ready
          path: ios-native/OAK-Gatekeeper-native-zsign-ready.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw unsigned native iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: OAK-Gatekeeper-iOS26.4-diagnostic-raw-unsigned
          path: ios-native/OAK-Gatekeeper-native-raw-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
