name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Test and build web
        working-directory: dashboard
        run: |
          npm ci
          npm run test
          npm run build

      - name: Test Cloudflare H1 timekeeper
        working-directory: cloudflare/h1-timekeeper
        run: npm test
