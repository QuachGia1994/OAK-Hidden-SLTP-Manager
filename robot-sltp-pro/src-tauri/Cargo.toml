[package]
name = "robot-sltp-pro"
version = "4.1.0"
description = "ROBOT SLTP Pro desktop trading workstation"
authors = ["QKP"]
edition = "2021"

[lib]
name = "robot_sltp_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
